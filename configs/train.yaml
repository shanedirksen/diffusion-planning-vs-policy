# ── Training configuration ──
# Merge with: base.yaml + env_*.yaml

defaults:
  - base
  # env override is passed via --env CLI flag

train:
  lr: 2.0e-4
  weight_decay: 1.0e-6
  batch_size: 1024
  n_train_steps: 200_000
  ema_decay: 0.995
  save_every: 50_000
  log_every: 1_000
  grad_clip: 1.0

checkpoint_dir: runs/checkpoints
log_dir: runs/logs
