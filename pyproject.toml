[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffplan"
version = "0.1.0"
description = "Diffusion Planning vs. Policy - comparing runtime modes of a single diffusion model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy",
    "gymnasium",
    "mujoco",
    "minari",
    "tqdm",
    "pyyaml",
    "matplotlib",
    "pandas",
    "imageio",
]

[project.optional-dependencies]
logging = ["tensorboard"]
dev = ["pytest", "black", "isort", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
